name: Produce and Publish
on:
  push:
    tags:
    - 'v*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [postdoc, quant]
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Get Current Date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d')"
      - name: Get Githash
        id: git_hash
        run: echo "::set-output name=git_hash::$(git rev-parse --short "$GITHUB_SHA")"
      - name: Get Git Branch
        id: git_branch
        run: echo "::set-output name=git_branch::${GITHUB_REF#refs/heads/}"
      - name: Set Version in Document
        uses: jacobtomlinson/gha-find-replace@v2
        with:
          find: "@@version@@"
          replace: "${{ steps.date.outputs.date }}-${{ steps.git_branch.outputs.git_branch }}-${{ steps.git_hash.outputs.git_hash }}"
          regex: false
      - name: Create github_artifacts
        run: mkdir -p github_artifacts
      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v2
        with:
          root_file: main-${{ matrix.variant }}.tex
      - name: move pdf
        run: mv ./main-${{ matrix.variant }}.pdf ./github_artifacts/
      # The academic CV is the one published at the top-level main.pdf URL,
      # so existing links keep working.
      - name: alias postdoc build as main.pdf
        if: ${{ matrix.variant == 'postdoc' }}
        run: cp ./github_artifacts/main-postdoc.pdf ./github_artifacts/main.pdf
      - name: Upload pdf as artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-${{ matrix.variant }}.pdf
          path: ./github_artifacts

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: github_artifacts
      - name: move
        run: mkdir -p github_deploy && mv github_artifacts/*/* github_deploy
      - name: deploy on orphan branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true
          enable_jekyll: true

  copy-index-to-build:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy To Branches Action
        uses: planetoftheweb/copy-to-branches@v1.3
        env:
          key: main
          files: index.html CNAME
